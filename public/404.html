<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="The page you were looking for could not be found. Return to the RIIT Global Tech home page or contact us for help."
    />
    <title>Page not found | RIIT Global Tech</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0e0f10;
        color: #f7f5f0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background-image:
          linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size: 80px 80px;
      }
      main {
        max-width: 42rem;
        padding: 2rem;
      }
      .brand {
        display: flex;
        align-items: center;
        margin-bottom: 3rem;
      }
      .brand img {
        width: auto;
        height: 44px;
      }
      p.label {
        color: #ed5156;
        text-transform: uppercase;
        letter-spacing: 0.24em;
        font-size: 0.65rem;
        font-weight: 700;
        margin: 0 0 1rem;
      }
      h1 {
        font-size: clamp(3rem, 9vw, 6rem);
        line-height: 0.95;
        letter-spacing: -0.05em;
        margin: 0 0 1.25rem;
      }
      p.copy {
        color: #a6a29b;
        line-height: 1.7;
        margin: 0 0 2rem;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      a.button {
        display: inline-flex;
        align-items: center;
        padding: 0.9rem 1.25rem;
        background: #ed5156;
        color: #171819;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      a.secondary {
        background: transparent;
        color: #f7f5f0;
        border: 1px solid #343536;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="/brand/riit-wordmark-on-dark.webp" alt="RIIT Global Tech" />
      </div>
      <p class="label">Error 404</p>
      <h1>This page is off the grid.</h1>
      <p class="copy">
        The page you are looking for may have moved, or the address may be incorrect. Use the links
        below to get back to something useful.
      </p>
      <div class="actions">
        <a class="button" href="/">Back to home</a>
        <a class="button secondary" href="/contact">Contact us</a>
      </div>
    </main>
  </body>
</html>
